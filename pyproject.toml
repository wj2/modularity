[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modularity"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = "<3.13,>=3.12"
license = "MIT"
keywords = []
authors = [
  { name = "wj2", email = "wjj@ucsf.edu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "numpy>=1.26.4",
  "pandas>=2.2.2",
  "matplotlib>=3.9.2",
  "scikit-learn>=1.5.1",
  "tensorboard>=2.16.2",
  "tensorflow>=2.16.2",
  "tensorflow-hub>=0.16.1",
  "tensorflow-probability>=0.24.0",
  "tf_keras>=2.16.0",
  "keras-cv>=0.9.0",
  "keras>=3.4.1",
  "seaborn>=0.13.2",
  "mne",
  "zarr>=3",
  "gcsfs>=2026",
  "dbcv @ git+https://github.com/FelSiq/DBCV",
  "general @ git+https://github.com/wj2/general-neural.git",
  "mixedselectivity_theory @ git+https://github.com/wj2/nms_error-correction.git",
  "composite_tangling @ git+https://github.com/wj2/composite_tangling.git",
  "superposition_codes @ git+https://github.com/wj2/superposition_codes.git",
  "disentangled @ git+https://github.com/wj2/disentangled.git",
  "vr2p @ file://{root}/../vr2p-public",
  "setuptools<82",
  "hydra-core",
  "jupyter",
  "notebook",
  "ipympl",
]

[project.scripts]
activity_mod = "modularity.activity_mod_script:main"
rep_mod = "modularity.activity_mod_rep_script:main"

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://github.com/wj2/modularity#readme"
Issues = "https://github.com/wj2/modularity/issues"
Source = "https://github.com/wj2/modularity"

[tool.hatch.version]
path = "modularity/__about__.py"
